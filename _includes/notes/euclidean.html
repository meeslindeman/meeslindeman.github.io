<style>
  .euc-wrap { display: flex; gap: 16px; align-items: flex-start; max-width: 70%; margin: 2rem auto; }
  .euc-wrap canvas { display: block; cursor: crosshair; border-radius: 6px; }
  .euc-sidebar { min-width: 140px; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
  .euc-z-card { border-radius: 6px; padding: 10px 12px; border-left: 3px solid; }
  .euc-z-label { font-size: 11px; color: rgba(0,0,0,0.4); margin-bottom: 4px; }
  .euc-z-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .euc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: rgba(0,0,0,0.4); margin-top: 8px; max-width: 70%; margin-left: auto; margin-right: auto; }
  .euc-leg { display: flex; align-items: center; gap: 5px; }
  .euc-leg-line { width: 18px; height: 2px; flex-shrink: 0; }
  .euc-leg-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>

<div class="euc-wrap">
  <canvas id="ce"></canvas>
  <div class="euc-sidebar">
    <div class="euc-z-card" style="border-color:#7F77DD">
      <div class="euc-z-label">z₁ = d(x, H₁)</div>
      <div class="euc-z-value" id="euc-z0" style="color:#7F77DD">—</div>
    </div>
    <div class="euc-z-card" style="border-color:#D85A30">
      <div class="euc-z-label">z₂ = d(x, H₂)</div>
      <div class="euc-z-value" id="euc-z1" style="color:#D85A30">—</div>
    </div>
    <div class="euc-z-card" style="border-color:#BA7517">
      <div class="euc-z-label">z₃ = d(x, H₃)</div>
      <div class="euc-z-value" id="euc-z2" style="color:#BA7517">—</div>
    </div>
  </div>
</div>
<div class="euc-legend">
  <div class="euc-leg"><div class="euc-leg-line" style="background:#7F77DD"></div>H₁</div>
  <div class="euc-leg"><div class="euc-leg-line" style="background:#D85A30"></div>H₂</div>
  <div class="euc-leg"><div class="euc-leg-line" style="background:#BA7517"></div>H₃</div>
  <div class="euc-leg"><div class="euc-leg-dot" style="background:#378ADD;border:1.5px solid #185FA5"></div>input x</div>
</div>

{% raw %}
<script>
(function(){
  const H_COLORS = ['#7F77DD','#D85A30','#BA7517'];
  const X_COL = '#378ADD';
  const axisCol = 'rgba(0,0,0,0.15)';
  const textCol = 'rgba(0,0,0,0.6)';

  const planes = [
    { a:1,    b:0.5,  c:-0.3, col:H_COLORS[0], label:'H₁' },
    { a:-0.3, b:1,    c: 0.4, col:H_COLORS[1], label:'H₂' },
    { a:0.7,  b:-0.8, c:-0.1, col:H_COLORS[2], label:'H₃' },
  ];

  let px = 0.5, py = 0.3, dragging = false;
  let W, H, sc, cx, cy;

  function init() {
    const c = document.getElementById('ce');
    if (!c) return;

    function resize() {
      const avail = Math.min(c.parentElement.clientWidth - 180, 320);
      W = avail; H = avail;
      c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
      c.style.width = W + 'px'; c.style.height = H + 'px';
      cx = W / 2; cy = H / 2;
      sc = Math.min(W, H) * 0.38;
      draw();
    }

    function draw() {
      const ctx = c.getContext('2d');
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.clearRect(0, 0, W, H);

      ctx.strokeStyle = axisCol; ctx.lineWidth = 1; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(20, cy); ctx.lineTo(W-20, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, 20); ctx.lineTo(cx, H-20); ctx.stroke();
      ctx.fillStyle = textCol; ctx.font = '11px sans-serif';
      ctx.fillText('x₁', W-16, cy-5);
      ctx.fillText('x₂', cx+5, 16);

      planes.forEach(({ a, b, c: cc, col, label }) => {
        const norm = Math.sqrt(a*a+b*b);
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([]);
        ctx.beginPath();
        for (let t = -2.5; t <= 2.5; t += 0.01) {
          const x = -b/norm*t - a*cc/(norm*norm);
          const y =  a/norm*t - b*cc/(norm*norm);
          t <= -2.49 ? ctx.moveTo(cx+x*sc, cy-y*sc) : ctx.lineTo(cx+x*sc, cy-y*sc);
        }
        ctx.stroke();
        const ex = -b/norm*2.2 - a*cc/(norm*norm);
        const ey =  a/norm*2.2 - b*cc/(norm*norm);
        ctx.fillStyle = col; ctx.font = '12px sans-serif';
        ctx.fillText(label, cx+ex*sc+4, cy-ey*sc);
      });

      planes.forEach(({ a, b, c: cc, col }) => {
        const norm = Math.sqrt(a*a+b*b);
        const dist = (a*px+b*py+cc)/norm;
        const fx = px-a*dist/norm, fy = py-b*dist/norm;
        ctx.strokeStyle = X_COL; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(cx+px*sc, cy-py*sc); ctx.lineTo(cx+fx*sc, cy-fy*sc); ctx.stroke();
        ctx.setLineDash([]);
        const perp_x = -b/norm, perp_y = a/norm;
        ctx.strokeStyle = col; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx+fx*sc-perp_x*5, cy-fy*sc+perp_y*5);
        ctx.lineTo(cx+fx*sc+perp_x*5, cy-fy*sc-perp_y*5);
        ctx.stroke();
      });

      ctx.fillStyle = X_COL; ctx.strokeStyle = '#185FA5'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(cx+px*sc, cy-py*sc, 7, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
      ctx.fillStyle = textCol; ctx.font = '13px sans-serif';
      ctx.fillText('x', cx+px*sc+10, cy-py*sc-4);

      planes.forEach(({ a, b, c: cc }, i) => {
        const norm = Math.sqrt(a*a+b*b);
        const dist = (a*px+b*py+cc)/norm;
        const sign = dist >= 0 ? '+' : '−';
        const el = document.getElementById('euc-z'+i);
        if (el) el.textContent = sign + Math.abs(dist).toFixed(3);
      });
    }

    function toWorld(ex, ey) {
      const rect = c.getBoundingClientRect();
      return { wx: (ex-rect.left-cx)/sc, wy: -(ey-rect.top-cy)/sc };
    }
    function clamp(v,lo,hi) { return Math.max(lo,Math.min(hi,v)); }

    c.addEventListener('mousedown', e => {
      const {wx,wy} = toWorld(e.clientX,e.clientY);
      if (Math.sqrt((wx-px)**2+(wy-py)**2) < 12/sc) { dragging=true; e.preventDefault(); }
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const {wx,wy} = toWorld(e.clientX,e.clientY);
      px=clamp(wx,-1.8,1.8); py=clamp(wy,-1.8,1.8); draw();
    });
    window.addEventListener('mouseup', () => dragging=false);
    c.addEventListener('touchstart', e => {
      const t=e.touches[0], {wx,wy}=toWorld(t.clientX,t.clientY);
      if (Math.sqrt((wx-px)**2+(wy-py)**2) < 18/sc) { dragging=true; e.preventDefault(); }
    }, {passive:false});
    window.addEventListener('touchmove', e => {
      if (!dragging) return;
      const t=e.touches[0], {wx,wy}=toWorld(t.clientX,t.clientY);
      px=clamp(wx,-1.8,1.8); py=clamp(wy,-1.8,1.8); draw(); e.preventDefault();
    }, {passive:false});
    window.addEventListener('touchend', () => dragging=false);
    window.addEventListener('resize', () => setTimeout(resize, 50));
    resize();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
{% endraw %}
