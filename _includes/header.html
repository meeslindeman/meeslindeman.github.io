<header class="site-header">
    <div class="header-container">
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
        
        <button class="mobile-menu-toggle" aria-expanded="false" aria-label="Toggle mobile menu">
            <i class="fas fa-bars"></i>
        </button>
        
        <nav class="main-nav">
            <ul>
                {% for nav_item in site.navigation %}
                <li>
                    <a href="{{ nav_item.url | relative_url }}" 
                       {% if page.url == nav_item.url or (nav_item.url != '/' and page.url contains nav_item.url) %}class="active"{% endif %}>
                        {{ nav_item.title }}
                    </a>
                </li>
                {% endfor %}
            </ul>
            
            <button class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
                <span>Dark</span>
            </button>
        </nav>
    </div>
</header>
