<header class="site-header">
    <div class="header-container">
        
        <button class="mobile-menu-toggle" aria-expanded="false" aria-label="Toggle mobile menu">
            <i class="fas fa-bars"></i>
        </button>

        <button class="theme-toggle" aria-label="Shuffle color theme" title="Shuffle theme">
        <i class="fas fa-palette" aria-hidden="true"></i>
        </button>
        
        <nav class="main-nav">
            <ul>
                {% for nav_item in site.navigation %}
                <li>
                    <a href="{{ nav_item.url | relative_url }}" 
                       {% if page.url == nav_item.url or (nav_item.url != '/' and page.url contains nav_item.url) %}class="active"{% endif %}>
                        {{ nav_item.title }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </nav>
    </div>
</header>
