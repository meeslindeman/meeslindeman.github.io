<header class="site-header">
    <div class="header-container">
        
        <!-- Mobile header actions (hamburger + theme toggle) -->
        <div class="mobile-header-actions">
            <button class="mobile-menu-toggle" aria-expanded="false" aria-label="Toggle mobile menu">
                <i class="fas fa-bars"></i>
            </button>
            
            <button class="theme-toggle mobile-theme-toggle" aria-label="Shuffle color theme" title="Shuffle theme">
                <i class="fas fa-palette" aria-hidden="true"></i>
            </button>
        </div>
        
        <nav class="main-nav">
            <ul>
                {% for nav_item in site.navigation %}
                <li>
                    <a href="{{ nav_item.url | relative_url }}" 
                       {% if page.url == nav_item.url or (nav_item.url != '/' and page.url contains nav_item.url) %}class="active"{% endif %}>
                        {{ nav_item.title }}
                    </a>
                </li>
                {% endfor %}
                <li class="nav-item-utility">
                <button class="theme-toggle desktop-theme-toggle" aria-label="Shuffle color theme" title="Shuffle theme">
                    <i class="fas fa-palette" aria-hidden="true"></i>
                </button>
                </li>
            </ul>
        </nav>
    </div>
</header>
