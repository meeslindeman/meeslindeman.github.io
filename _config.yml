# Site settings
title: Mees Lindeman
email: mees@lindeman.nu
description: >-
  MSc Student in Artificial Intelligence at University of Amsterdam, 
  exploring conceptual questions in AI systems.
baseurl: ""
url: "https://meeslindeman.github.io"

# Personal information
author:
  name: Mees Lindeman
  title: MSc Student, Artificial Intelligence
  institution: University of Amsterdam
  location: Amsterdam, Netherlands
  graduation_year: 2025

# Social links
social:
  linkedin: https://linkedin.com/in/meeslindeman
  github: https://github.com/meeslindeman
  scholar: https://scholar.google.com/citations?user=YOUR_ID
  orcid: https://orcid.org/YOUR-ORCID-ID
  twitter: https://twitter.com/meeslindeman
  researchgate: https://www.researchgate.net/profile/Mees-Lindeman

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - .gitignore

# Collections for structured content
collections:
  publications:
    output: true
    permalink: /:collection/:name/
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults for front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Site navigation
navigation:
  - title: Home
    url: /
  - title: Resume
    url: /resume/
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/

# SEO and social
google_analytics: # Add your GA tracking ID
twitter:
  username: meeslindeman
  card: summary

# Jekyll admin (optional)
jekyll_admin:
  hidden_links:
    - posts
    - pages