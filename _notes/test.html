<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tangent space, Log and Exp maps</title>
<style>
  body { margin: 0; padding: 20px; background: #0f0f11; color: rgba(255,255,255,0.65); font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; }
  .ctrl { display:flex; align-items:center; gap:10px; font-size:13px; color:rgba(255,255,255,0.55); margin:6px 0; }
  .ctrl label { min-width:130px; }
  .ctrl input[type=range] { flex:1; accent-color:#7F77DD; }
  .ctrl span { min-width:40px; font-variant-numeric:tabular-nums; }
  .info-row { display:flex; gap:24px; flex-wrap:wrap; margin:10px 0 4px; font-size:12px; color:rgba(255,255,255,0.45); }
  .info-item { display:flex; align-items:center; gap:6px; }
  .swatch { width:14px; height:3px; border-radius:2px; flex-shrink:0; }
  h2 { font-size:15px; font-weight:500; color:rgba(255,255,255,0.8); margin:0 0 16px; }
</style>
</head>
<body>
<h2>Tangent space, Log and Exp maps on the hyperboloid</h2>
<canvas id="c" height="420"></canvas>

<div class="ctrl">
  <label>Base point p (φ_p)</label>
  <input type="range" id="bp" min="-120" max="120" value="-50" step="1">
  <span id="bp-v"></span>
</div>
<div class="ctrl">
  <label>Point x (φ_x)</label>
  <input type="range" id="xp" min="-120" max="120" value="60" step="1">
  <span id="xp-v"></span>
</div>

<div class="info-row">
  <div class="info-item"><div class="swatch" style="background:#1D9E75;height:2px;width:24px;"></div>hyperboloid ℒ¹</div>
  <div class="info-item"><div class="swatch" style="background:#7F77DD;height:2px;width:24px;"></div>tangent space T_p ℒ¹</div>
  <div class="info-item"><div class="swatch" style="background:#D85A30;border-radius:50%;width:10px;height:10px;"></div>base point p</div>
  <div class="info-item"><div class="swatch" style="background:#378ADD;border-radius:50%;width:10px;height:10px;"></div>point x on manifold</div>
  <div class="info-item"><div class="swatch" style="background:#EF9F27;border-radius:50%;width:10px;height:10px;"></div>Log_p(x) in tangent space</div>
  <div class="info-item"><div class="swatch" style="background:#378ADD;height:1px;width:24px;border-top:2px dashed #378ADD;"></div>geodesic p→x</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const textCol = 'rgba(255,255,255,0.65)';
const axisCol = 'rgba(255,255,255,0.1)';

function resize() {
  const W = canvas.parentElement.clientWidth;
  canvas.width = W * devicePixelRatio;
  canvas.height = 420 * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = '420px';
  draw();
}

function getVals() {
  const phi_p = +document.getElementById('bp').value * Math.PI / 180;
  const phi_x = +document.getElementById('xp').value * Math.PI / 180;
  document.getElementById('bp-v').textContent = (+document.getElementById('bp').value) + '°';
  document.getElementById('xp-v').textContent = (+document.getElementById('xp').value) + '°';
  return { phi_p, phi_x };
}

function draw() {
  const W = canvas.width / devicePixelRatio;
  const H = canvas.height / devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const { phi_p, phi_x } = getVals();
  const sc = H * 0.3;
  const ox = W * 0.5, oy = H * 0.76;

  function toC(xs, ts) { return { cx: ox + xs * sc, cy: oy - ts * sc }; }
  function hpt(phi) { return { t: Math.cosh(phi), x: Math.sinh(phi) }; }

  ctx.strokeStyle = axisCol; ctx.lineWidth = 1; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(ox, oy + 15); ctx.lineTo(ox, 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, oy); ctx.lineTo(W - 20, oy); ctx.stroke();
  ctx.fillStyle = textCol; ctx.font = '11px sans-serif';
  ctx.fillText('t', ox + 4, 18);
  ctx.fillText('x', W - 18, oy - 5);

  ctx.strokeStyle = axisCol; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + H * 0.74, oy - H * 0.74); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox - H * 0.74, oy - H * 0.74); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = '#1D9E75'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let phi = -2.4; phi <= 2.4; phi += 0.02) {
    const p = hpt(phi);
    const c = toC(p.x, p.t);
    phi === -2.4 ? ctx.moveTo(c.cx, c.cy) : ctx.lineTo(c.cx, c.cy);
  }
  ctx.stroke();

  const P = hpt(phi_p);
  const cP = toC(P.x, P.t);
  const tx = Math.cosh(phi_p);
  const tt = Math.sinh(phi_p);
  const sdx = tx * sc, sdy = -tt * sc;
  const sdLen = Math.sqrt(sdx * sdx + sdy * sdy);
  const planeLen = 2.2;
  const t1x = cP.cx - (sdx / sdLen) * planeLen * sc;
  const t1y = cP.cy - (sdy / sdLen) * planeLen * sc;
  const t2x = cP.cx + (sdx / sdLen) * planeLen * sc;
  const t2y = cP.cy + (sdy / sdLen) * planeLen * sc;

  ctx.strokeStyle = '#7F77DD'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(t1x, t1y); ctx.lineTo(t2x, t2y); ctx.stroke();
  ctx.fillStyle = '#534AB7'; ctx.font = '12px sans-serif';
  ctx.fillText('T_p ℒ¹', t2x + 6, t2y + 4);

  const X = hpt(phi_x);
  const cX = toC(X.x, X.t);

  ctx.strokeStyle = '#378ADD'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const phi_i = phi_p + (phi_x - phi_p) * i / 60;
    const pi = hpt(phi_i);
    const ci = toC(pi.x, pi.t);
    i === 0 ? ctx.moveTo(ci.cx, ci.cy) : ctx.lineTo(ci.cx, ci.cy);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  const d = phi_x - phi_p;
  const sign = d >= 0 ? 1 : -1;
  const logVec_x = sign * Math.abs(d) * Math.cosh(phi_p);
  const logVec_t = sign * Math.abs(d) * Math.sinh(phi_p);
  const logPt_cx = cP.cx + logVec_x * sc;
  const logPt_cy = cP.cy - logVec_t * sc;

  ctx.strokeStyle = '#EF9F27'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cP.cx, cP.cy); ctx.lineTo(logPt_cx, logPt_cy); ctx.stroke();
  const ang = Math.atan2(logPt_cy - cP.cy, logPt_cx - cP.cx);
  ctx.fillStyle = '#EF9F27';
  ctx.beginPath();
  ctx.moveTo(logPt_cx, logPt_cy);
  ctx.lineTo(logPt_cx - 9 * Math.cos(ang - 0.4), logPt_cy - 9 * Math.sin(ang - 0.4));
  ctx.lineTo(logPt_cx - 9 * Math.cos(ang + 0.4), logPt_cy - 9 * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = '#EF9F27'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(logPt_cx, logPt_cy); ctx.lineTo(cX.cx, cX.cy); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#BA7517'; ctx.font = '11px sans-serif';
  ctx.fillText('Exp_p(v)', (logPt_cx + cX.cx) / 2 + 6, (logPt_cy + cX.cy) / 2);

  ctx.fillStyle = '#D85A30'; ctx.strokeStyle = '#993C1D'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cP.cx, cP.cy, 7, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillStyle = textCol; ctx.font = '13px sans-serif';
  ctx.fillText('p', cP.cx + 9, cP.cy - 5);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '10px sans-serif';
  ctx.fillText('(base point)', cP.cx + 9, cP.cy + 8);

  ctx.fillStyle = '#378ADD'; ctx.strokeStyle = '#185FA5'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cX.cx, cX.cy, 7, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillStyle = textCol; ctx.font = '13px sans-serif';
  ctx.fillText('x', cX.cx + 9, cX.cy - 5);

  ctx.fillStyle = '#EF9F27'; ctx.strokeStyle = '#854F0B'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(logPt_cx, logPt_cy, 5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#EF9F27'; ctx.font = '12px sans-serif';
  ctx.fillText('v = Log_p(x)', logPt_cx + 8, logPt_cy - 4);

  ctx.fillStyle = textCol; ctx.font = '11px sans-serif';
  ctx.fillText('‖v‖ = d(p, x) = ' + Math.abs(d).toFixed(2), 14, H - 14);

  const cO = toC(0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(cO.cx, cO.cy, 3, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = textCol; ctx.font = '11px sans-serif';
  ctx.fillText('o', cO.cx + 5, cO.cy + 4);
}

document.getElementById('bp').oninput = () => { getVals(); draw(); };
document.getElementById('xp').oninput = () => { getVals(); draw(); };
window.addEventListener('resize', () => setTimeout(resize, 50));
resize();
</script>
</body>
</html>
