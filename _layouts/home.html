---
layout: default
---

<div class="container">
    <!-- Profile Section -->
    <section class="profile">
        <div class="profile-photo">
            <img src="{{ '/assets/images/profile.jpg' | relative_url }}" 
                 alt="{{ site.author.name }}" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="profile-placeholder">
                <i class="fas fa-user"></i>
            </div>
        </div>
        
        <h1 class="profile-name">{{ site.author.name }}</h1>
        <p class="profile-title"> 
            <i class="fas fa-map-marker-alt"></i> {{ site.author.title }}
        </p>
        <p class="profile-institution">
            <i class="fas fa-university"></i> {{ site.author.institution }}
        </p>

    </section>

    <!-- Content Sections -->
    <div class="content">
        {{ content }}
    </div>
</div>
