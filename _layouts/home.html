---
layout: default
---

<div class="container container--home-centered">
    <!-- Profile Section -->
    <section class="profile-hero">
        <div class="profile-hero__photo">
            <img src="{{ '/assets/images/profile.jpg' | relative_url }}" 
                 alt="{{ site.author.name }}" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="profile-hero__placeholder">
                <i class="fas fa-user"></i>
            </div>
        </div>
        
        <h1 class="profile-hero__name">{{ site.author.name }}</h1>
        <p class="profile-hero__title">{{ site.author.title }}</p>
        <p class="profile-hero__institution">{{ site.author.institution }}</p>
        
        {% if site.author.bio_quote %}
        <blockquote class="profile-hero__quote">
            "{{ site.author.bio_quote }}"
        </blockquote>
        {% endif %}
    </section>

    <!-- Main Content -->
    <div class="home-content">
        {{ content }}
    </div>
</div>
