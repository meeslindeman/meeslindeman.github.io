- project: Bachelor Thesis
  name: Exploring Language Compositionality in Multi-Agent Systems
  duration: 2024
  url: "https://scripties.uba.uva.nl/search?id=record_54284"
  technologies: Python, PyTorch
  misc: "Grade: 8.0/10"
  description: Investigated the emergence of compositional language in referential games between artificial agents, using Graph Neural Networks (GNNs) to model structured input. Explored how agents develop communication strategies to describe family relations, analyzing the impact of different training setups on language expressiveness and efficiency.