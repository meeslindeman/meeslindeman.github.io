projects:
  - project: Model Compression for Machine Translation in Large Language Models
    role: Deep Learning for NLP Course Project
    duration: 2025
    technologies: Python, PyTorch, Hugging Face Transformers, Llama.cpp
    misc: Co-authored with M. van der Brugge, R. Figge, M. Hagenauer, and T. Wiegman
    code: "https://github.com/matthias-hagenauer/DL4NLP"
    # document_url: assets/docs/dl4nlp.pdf
    description: Explored how model quantization impacts machine translation (MT) performance across varying sentence difficulty levels. Using quantized variants (8-, 4-, and 2-bit) of TowerMistral and Gemma-3, evaluated across four languages, we examine how reduced precision influences both semantic and surface-level translation quality.
    featured: true
    date: 2025-10-13

  - project: Enhancing Few-Shot Robotic Manipulation by Replacing Depth Sensors with Learned 3D Geometry from MASt3R
    role: Deep Learning 2 Course Project
    duration: 2025
    technologies: Python, PyTorch, Docker, Singularity
    misc: Co-authored with R. Figge, S. Gunneweg, and J. de Heus
    code: "https://github.com/sjoerdgunneweg/mast3r-rvt2-integration"
    # document_url: assets/docs/dl2.pdf
    description: Investigated whether learned 3D geometry from RGB images can replace depth sensors in few-shot robotic manipulation. Integrated MASt3R, a state-of-the-art 3D reconstruction method, into the RVT-2 robotic vision pipeline to evaluate performance without RGB-D sensors. Demonstrated that learned geometry can enable robust manipulation under challenging visual conditions. Possibly offering a more flexible, cost-effective alternative to traditional calibrated setups.
    featured: true
    date: 2025-01-15

  - project: AI for Dummies
    role: Creator & Instructor
    duration: 2025 &mdash; Present
    technologies: Node.js, React, Python
    url: "https://aifordummies.vercel.app"
    misc: Making AI concepts accessible for my colleagues
    description: AI for Dummies is an educational initiative I started to explain AI concepts to beginners. Sparked by growing interest and common misconceptions observed during my work at HvA, the project aims to deliver intuitive lessons and providing backup to workshops on topics like machine learning, probability, and generative AI.
    featured: true
    date: 2024-12-01
    
  - project: Exploring Language Compositionality in Multi-Agent Systems
    role: Bachelor Thesis
    duration: 2024
    technologies: Python, PyTorch
    misc: "Grade: 8.0/10"
    code: "https://github.com/meeslindeman/bachelor-thesis"
    description: Investigated the emergence of compositional language in referential games between artificial agents, using Graph Neural Networks (GNNs) to model structured input. Explored how agents develop communication strategies to describe family relations, analyzing the impact of different training setups on language expressiveness and efficiency.
    featured: false
    date: 2024-06-15