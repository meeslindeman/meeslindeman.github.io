  - title: "Vision-Based Robotic Manipulation with Learned 3D Geometry"
    authors:
      - name: "Mees Lindeman"
        is_self: true
    venue: "Master's Thesis, University of Amsterdam"
    year: 2025
    type: "thesis"
    status: "in_progress"
    abstract: "This thesis investigates whether learned 3D geometry from RGB images can replace depth sensors in few-shot robotic manipulation tasks. By integrating MASt3R, a state-of-the-art 3D reconstruction method, into the RVT-2 robotic vision pipeline, we evaluate performance without RGB-D sensors and demonstrate robust manipulation under challenging visual conditions, potentially offering a more flexible and cost-effective alternative to traditional calibrated setups."
