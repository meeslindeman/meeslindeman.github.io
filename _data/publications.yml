publications:
  - title: "LoViT: Intrinsic Lorentz Vision Transformer"
    authors: "Mees Lindeman, Gowreesh Mago, Pritam Mishra, Pascal Mettes"
    venue: "Beyond Euclidean Workshop (BEW), ECCV"
    year: "2026"
    type: "Workshop Paper"
    status: "Accepted"
    summary: "Most hyperbolic vision architectures are only extrinsically hyperbolic, falling back to Euclidean computation before re-projecting onto the manifold, a shortcut shown to undercut the benefits of hyperbolic geometry. We introduce LoViT, the first Intrinsic Lorentz Vision Transformer, carrying intrinsic treatment throughout, including a residual connection defined as geodesic interpolation. Trained from scratch, LoViT surpasses a Euclidean baseline and extrinsic hyperbolic transformers on CIFAR-10, CIFAR-100, and Tiny-ImageNet."

  - title: "On the Optimality of Kinship Naming: an Information-theoretic Approach"
    authors: "Phong Le, Mees Lindeman, Raquel G. Alhama"
    venue: "EMNLP"
    year: "2026"
    type: "Conference Paper"
    status: "Accepted"
    summary: "Naming systems trade off informativeness against complexity. Focusing on kinship naming, we revisit two simplifying assumptions of prior work, universal communicative need and optimal listeners, using data from four languages. Adopting a referential game setup from emergent communication, we show that trade-off optimality is not only theoretically achievable but also emerges empirically in learned communication systems."

  - title: "Reassessing Fairness: A Reproducibility Study of NIFA's Impact on GNN Models"
    authors: "Mees Lindeman, Ruben Figge, Sjoerd Gunneweg, Aaron Kuin"
    venue: "TMLR" 
    year: "2025"
    type: "Journal Article" 
    url: "https://openreview.net/pdf?id=l5fXUKi8GO"
    code: "https://github.com/sjoerdgunneweg/Reassessing-NIFA"
    status: "Accepted" 
    summary: "Published in TMLR (2025). Selected for presentation at the 2025 Machine Learning Reproducibility Challenge held at Princeton University. This study evaluates the claims and results of <a href='https://arxiv.org/abs/2406.03052'><em>Are Your Models Still Fair? Fairness Attacks on Graph Neural Networks via Node Injections</em></a>. Assessed implementation, experimental setup, and generalizability to provide insights into the robustness of the original findings."