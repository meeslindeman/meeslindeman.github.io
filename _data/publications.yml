    abstract: "This project investigated the emergence of compositional language in referential games between artificial agents, using Graph Neural Networks to model structured input. We explored how agents develop communication strategies to describe family relations and analyzed the impact of different training setups on language expressiveness and efficiency, contributing to our understanding of emergent communication in multi-agent systems."
